# fail2ban filter — Praktikum 3 (BAB 3)
# Mengenali permintaan HTTP yang berasal dari pemindai, bukan dari pengguna.
#
# Pola yang dicocokkan:
#   1. User-Agent khas nmap / Nmap Scripting Engine
#   2. Permintaan ke jalur yang hanya diuji pemindai (mis. /nmaplowercheck)
#   3. Permintaan tanpa User-Agent sama sekali (HTTP/1.0 dari nmap)
#
# Sesuaikan `failregex` bila berkas log Anda memakai format lain.

[Definition]

failregex = ^<HOST> - - \[[^\]]*\] "GET /nmaplowercheck[^"]*" \d+
            ^<HOST> - - \[[^\]]*\] "[^"]*" \d+ \d+ "[^"]*" "Mozilla/5\.0 \(compatible; Nmap[^"]*"
            ^<HOST> - - \[[^\]]*\] "[^"]*HTTP/1\.0" \d+ \d+ "-" "-"

ignoreregex =

# Catatan: `ignoreregex` sengaja dibiarkan kosong. Bila laboratorium Anda
# memakai pemantau internal yang juga ber-User-Agent "-", tambahkan alamatnya
# ke `ignoreip` pada jail.local — jangan melemahkan failregex.
